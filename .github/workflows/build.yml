name: Build CoG Console

on:
  workflow_dispatch:

jobs:
  # JOB 1: ANDROID (Fixed "Missing Script" Error)
  build-android:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Dependencies
        run: npm install
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli
      
      # 1. Initialize Android Project
      - name: Initialize Android
        run: npm run tauri android init

      # 2. Generate Keystore (For Release Mode)
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore src-tauri/gen/android/release.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Android Debug,O=Android,C=US"

      # 3. SURGICAL FIX (The Magic Step)
      # This fixes BOTH the 'settings.gradle' crash and the 'build.gradle' configuration.
      - name: Fix Android Config (Remove broken link & Update SDK)
        run: |
          node -e "
            const fs = require('fs');
            
            // --- FIX 1: Prevent 'tauri.settings.gradle' Crash ---
            // We simply remove the line that tries to import the missing file.
            const settingsPath = 'src-tauri/gen/android/settings.gradle';
            try {
              let settings = fs.readFileSync(settingsPath, 'utf8');
              // Comment out the line importing tauri.settings.gradle
              settings = settings.replace(/apply from: .*tauri\.settings\.gradle.*/g, '// line removed by build script');
              fs.writeFileSync(settingsPath, settings);
              console.log('Fixed settings.gradle!');
            } catch (e) {
              console.log('Warning: settings.gradle not found (might be ok).');
            }

            // --- FIX 2: Configure Build (SDK 35 + Signing + Release) ---
            const buildPath = 'src-tauri/gen/android/app/build.gradle.kts';
            try {
              let content = fs.readFileSync(buildPath, 'utf8');

              const signingBlock = \`
                  signingConfigs {
                      create(\"release\") {
                          storeFile = file(\\\"../../release.keystore\\\")
                          storePassword = \\\"password\\\"
                          keyAlias = \\\"android\\\"
                          keyPassword = \\\"password\\\"
                      }
                  }
              \`;

              content = content.replace('buildTypes {', signingBlock + '\\n    buildTypes {');

              content = content.replace(
                  /release \{[\s\S]*?\}/,
                  \`release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      signingConfig = signingConfigs.getByName(\"release\")
                      proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")
                  }\`
              );

              content = content.replace('minSdk = 24', 'minSdk = 29');
              
              // Add ARM64 Filter to reduce size
              content = content.replace(
                  'versionName = \"1.0\"',
                  \`versionName = \"1.0\"
                  ndk {
                      abiFilters += listOf(\"arm64-v8a\")
                  }\`
              );

              fs.writeFileSync(buildPath, content);
              console.log('Fixed build.gradle.kts!');
            } catch (e) {
               console.error('Error fixing build.gradle.kts:', e);
               process.exit(1); 
            }
          "

      # 4. Build Release APK
      - name: Build Release APK
        run: |
          cd src-tauri/gen/android
          chmod +x gradlew
          ./gradlew assembleRelease

      # 5. Upload Results
      - name: Upload Ultra-Light Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CoG-Console-Android-Lite
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # JOB 2: WINDOWS
  build-windows:
    permissions: write-all
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Dependencies
        run: npm install
      - name: Build Windows EXE
        run: npm run tauri build
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: CoG-Console-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
