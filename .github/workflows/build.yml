name: Build CoG Console

on:
  workflow_dispatch:

jobs:
  build-android:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Dependencies
        run: npm install
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli
      
      # 1. Initialize (Generates the project structure)
      - name: Initialize Android
        run: npm run tauri android init

      # 2. Generate a Key (Required for Release Mode)
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore src-tauri/gen/android/release.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Android Debug,O=Android,C=US"

      # 3. The "Trojan Horse" Patch
      # We inject our specific settings (Signing + Optimization) into the build file
      # BEFORE the build starts.
      - name: Configure Android Build
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/gen/android/app/build.gradle.kts';
            try {
              let content = fs.readFileSync(path, 'utf8');

              // A. Define the Signing Config
              const signingBlock = \`
                  signingConfigs {
                      create(\"release\") {
                          storeFile = file(\\\"../../release.keystore\\\")
                          storePassword = \\\"password\\\"
                          keyAlias = \\\"android\\\"
                          keyPassword = \\\"password\\\"
                      }
                  }
              \`;

              // B. Inject Signing Config
              content = content.replace('buildTypes {', signingBlock + '\\n    buildTypes {');

              // C. Configure Release Mode (Minify + Sign + Shrink)
              content = content.replace(
                  /release \{[\s\S]*?\}/,
                  \`release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      signingConfig = signingConfigs.getByName(\"release\")
                      proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")
                  }\`
              );

              // D. Update SDK to 29 (Android 10)
              content = content.replace('minSdk = 24', 'minSdk = 29');

              // E. STRICT FILTER: Keep only Modern 64-bit processors (Small Size)
              content = content.replace(
                  'versionName = \"1.0\"',
                  \`versionName = \"1.0\"
                  ndk {
                      abiFilters += listOf(\"arm64-v8a\")
                  }\`
              );

              fs.writeFileSync(path, content);
              console.log('Successfully patched build.gradle.kts');
            } catch (error) {
              console.error('Patch failed:', error);
              process.exit(1);
            }
          "

      # 4. Build using the CLI (FIXED COMMAND)
      # We removed '--release'. By simply omitting '--debug', it defaults to Release mode.
      - name: Build Android APK
        run: npm run tauri android build -- --apk

      # 5. Upload the Result
      - name: Upload Ultra-Light Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CoG-Console-Android-Lite
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # JOB 2: WINDOWS
  build-windows:
    permissions: write-all
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Dependencies
        run: npm install
      - name: Build Windows EXE
        run: npm run tauri build
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: CoG-Console-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
