name: Build CoG Console

on:
  workflow_dispatch:

jobs:
  # JOB 1: ANDROID
  build-android:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Dependencies
        run: npm install
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli
      
      # This step CREATES the 'gen' folder.
      - name: Initialize Android
        run: npm run tauri android init

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore src-tauri/gen/android/release.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Android Debug,O=Android,C=US"

      # Configure the temporary 'gen' folder
      - name: Configure Android Build
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/gen/android/app/build.gradle.kts';
            let content = fs.readFileSync(path, 'utf8');

            const signingBlock = \`
                signingConfigs {
                    create(\"release\") {
                        storeFile = file(\\\"../../release.keystore\\\")
                        storePassword = \\\"password\\\"
                        keyAlias = \\\"android\\\"
                        keyPassword = \\\"password\\\"
                    }
                }
            \`;

            content = content.replace('buildTypes {', signingBlock + '\\n    buildTypes {');

            content = content.replace(
                /release \{[\s\S]*?\}/,
                \`release {
                    isMinifyEnabled = true
                    isShrinkResources = true
                    signingConfig = signingConfigs.getByName(\"release\")
                    proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")
                }\`
            );

            content = content.replace('minSdk = 24', 'minSdk = 29');

            content = content.replace(
                'versionName = \"1.0\"',
                \`versionName = \"1.0\"
                ndk {
                    abiFilters += listOf(\"arm64-v8a\")
                }\`
            );

            fs.writeFileSync(path, content);
          "

      # Build Release APK
      - name: Build Release APK
        run: |
          cd src-tauri/gen/android
          chmod +x gradlew
          ./gradlew assembleRelease

      # THE FIX: Look for ANY apk file using '**'
      - name: Upload Ultra-Light Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CoG-Console-Android-Lite
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # JOB 2: WINDOWS
  build-windows:
    permissions: write-all
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Dependencies
        run: npm install
      - name: Build Windows EXE
        run: npm run tauri build
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: CoG-Console-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
