name: Build CoG Console

on:
  workflow_dispatch:

jobs:
  # JOB 1: ANDROID (Ultra-Light Config)
  build-android:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Dependencies
        run: npm install
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli
      
      - name: Initialize Android
        run: npm run tauri android init

      # Generate a temporary signing key so we can build in RELEASE mode
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore src-tauri/gen/android/release.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Android Debug,O=Android,C=US"

      # Inject Optimization: SDK 35, MinSDK 29, ARM64 Only, Release Signing
      - name: Inject Optimization
        run: |
          cat > src-tauri/gen/android/app/build.gradle.kts <<EOF
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("rust")
          }
          android {
              namespace = "com.cog.console"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.cog.console"
                  minSdk = 29        // Android 10+
                  targetSdk = 35     // Android 15
                  versionCode = 1
                  versionName = "1.0"
                  
                  // STRICT FILTER: Only allow Modern 64-bit Processors
                  ndk {
                      abiFilters += listOf("arm64-v8a")
                  }
              }
              
              signingConfigs {
                  create("release") {
                      storeFile = file("../../release.keystore")
                      storePassword = "password"
                      keyAlias = "android"
                      keyPassword = "password"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true   // Shrink Code
                      isShrinkResources = true // Shrink Resources
                      signingConfig = signingConfigs.getByName("release")
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.10.1")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.9.0")
          }
          EOF

      # Build Release (No --debug flag)
      - name: Build Android APK
        run: npm run tauri android build

      - name: Upload Ultra-Light Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CoG-Console-Android-Lite
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk

  # JOB 2: FOR WINDOWS
  build-windows:
    permissions: write-all
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Dependencies
        run: npm install
      - name: Build Windows EXE
        run: npm run tauri build
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: CoG-Console-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
