name: Build CoG Console

on:
  workflow_dispatch:

jobs:
  build-android:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Dependencies
        run: npm install
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli
      
      - name: Initialize Android
        run: npm run tauri android init

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Android Debug,O=Android,C=US"

      # This step enables the Size Reduction (Arm64 only)
      - name: Inject Optimization Settings
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/gen/android/app/build.gradle.kts';
            try {
              let content = fs.readFileSync(path, 'utf8');

              // 1. Enable Minification (Shrinking)
              content = content.replace(
                  /release \{[\s\S]*?\}/,
                  \`release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")
                  }\`
              );

              // 2. Update SDK to 29 (Android 10)
              content = content.replace('minSdk = 24', 'minSdk = 29');

              // 3. STRICT FILTER: Keep only Modern 64-bit processors (Small Size)
              content = content.replace(
                  /versionName = \".*\"/,
                  \`versionName = \"1.0\"
                  ndk {
                      abiFilters += listOf(\"arm64-v8a\")
                  }\`
              );

              fs.writeFileSync(path, content);
              console.log('Successfully patched build.gradle.kts');
            } catch (error) {
              console.error('Patch failed:', error);
              process.exit(1);
            }
          "

      # FIXED COMMAND: Added 'true' to satisfy the strict builder
      - name: Build Android APK
        run: npm run tauri android build -- --apk true

      # Manual Signing Step (Guarantees Installation)
      - name: Sign APK Manually
        run: |
          # 1. Find the unsigned APK
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          
          # 2. Find the build tools
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | sort -r | head -n 1)
          ZIPALIGN="$BUILD_TOOLS_PATH/zipalign"
          APKSIGNER="$BUILD_TOOLS_PATH/apksigner"
          
          # 3. Optimize (Zipalign)
          $ZIPALIGN -v -p 4 "$APK_PATH" aligned.apk
          
          # 4. Sign (The Digital Seal)
          $APKSIGNER sign --ks release.keystore --ks-pass pass:password --out final-signed.apk aligned.apk

      - name: Upload Signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CoG-Console-Android-Signed
          path: final-signed.apk

  build-windows:
    permissions: write-all
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Dependencies
        run: npm install
      - name: Build Windows EXE
        run: npm run tauri build
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: CoG-Console-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
